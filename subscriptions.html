<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscriptions</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/subscriptions.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>Subscriptions</h1>
    <nav><a href="/">← Back to feed</a></nav>
  </div>
  <form class="bar" id="add">
    <input id="url" type="text" autocomplete="off" placeholder="Paste a link or feed, optionally followed by tags" required>
    <button class="primary" type="submit" value="subscribe" title="Follow a feed, CalDAV calendar, .ics link, YouTube channel, blog, NRK TV series, Jellyfin server… (feeds.txt)">Subscribe</button>
    <button type="submit" value="link" title="Add this page to links.txt">Add link</button>
    <button type="button" id="refresh" title="Re-fetch every link and check every subscription now">Refresh all</button>
    <p class="subscription-hint">For Radicale, paste the URL of each calendar you want here, one at a time.</p>
    <p id="message" role="status"></p>
  </form>
  <div class="tools">
    <input id="filter" type="search" placeholder="Search subscriptions by name, address or tag" aria-label="Search subscriptions">
    <select id="sort" aria-label="Sort subscriptions">
      <option value="file">Order in feeds.txt</option>
      <option value="name">Name</option>
      <option value="latest">Latest post</option>
      <option value="problems">Problems first</option>
    </select>
  </div>
</header>
<main id="list"></main>
<footer class="site-footer">ContentFeed · v{{VERSION}}</footer>

<script src="/common.js"></script>
<script src="/subscriptions.js"></script>
</body>
</html>
